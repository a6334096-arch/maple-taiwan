name: 同步台灣賞楓資料

on:
  schedule:
    # UTC 00:30 / 02:30 = 台灣 08:30 / 10:30，第二次補抓較晚完成的查核。
    - cron: '30 0,2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maple-data-backup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAPLE_SITE_URL: https://maple-taiwan-responsive.a6334096.chatgpt.site
    steps:
      - name: 取得儲存庫預設分支
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 準備 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 下載並驗證網站公開資料
        run: python scripts/sync-github-data.py
      - name: 將驗證後的楓況同步到正式網站
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('data/current/foliage.json')
          destination = Path('web/foliage.json')
          places = json.loads(Path('web/places.json').read_text(encoding='utf-8'))
          foliage = json.loads(source.read_text(encoding='utf-8'))
          expected = {p['id'] for p in places}
          observations = foliage.get('foliage')
          if not isinstance(observations, dict) or set(observations) != expected:
              raise SystemExit('楓況景點 ID 與正式網站不一致，停止更新')
          # 保留原本有日期、來源的實際紀錄；遠端 null 只代表這次未查到新紀錄。
          previous = json.loads(destination.read_text(encoding='utf-8')).get('foliage', {})
          for place_id, old_record in previous.items():
              new_record = observations.get(place_id)
              if not isinstance(old_record, dict):
                  continue
              if not isinstance(new_record, dict):
                  observations[place_id] = old_record
                  continue
              old_date = old_record.get('observed_on') or old_record.get('reported_at') or ''
              new_date = new_record.get('observed_on') or new_record.get('reported_at') or ''
              if old_date > new_date:
                  observations[place_id] = old_record
          if not any(isinstance(v, dict) for v in observations.values()):
              print('沒有有效的楓況觀測，保留正式網站原資料')
          else:
              content = json.dumps(foliage, ensure_ascii=False, indent=2, sort_keys=True) + chr(10)
              destination.write_text(content, encoding='utf-8')
              print('已合併同步有日期的楓況資料至 web/foliage.json')
          PY
      - name: 只提交有變更的資料
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/current/places.json data/current/seasons.json data/current/foliage.json web/foliage.json
          if git diff --cached --quiet; then
            echo "資料沒有變更，不新增提交。"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: sync official maple site snapshots'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD
